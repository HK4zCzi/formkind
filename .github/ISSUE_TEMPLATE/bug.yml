name: Bug report
description: Report a reproducible FormKind problem.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Remove personal and secret data from HTML samples. Report vulnerabilities privately through GitHub Security Advisories.
  - type: input
    id: version
    attributes:
      label: FormKind version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command and minimal HTML.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 22, Ubuntu 24.04
    validations:
      required: true
